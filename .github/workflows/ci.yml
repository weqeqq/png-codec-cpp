name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            decoder: wuffs
            encoder: fpng
            job_name: Linux / Wuffs + FPNG
          - os: ubuntu-24.04
            decoder: lodepng
            encoder: lodepng
            job_name: Linux / LodePNG
          - os: macos-15
            decoder: wuffs
            encoder: fpng
            job_name: macOS / Wuffs + FPNG
          - os: windows-2022
            decoder: wuffs
            encoder: fpng
            job_name: Windows / Wuffs + FPNG

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Meson and Ninja
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson==1.10.1 ninja==1.13.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install googletest pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11

      - name: Install Windows test packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install gtest:x64-windows
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Meson on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            extra_args+=("--cmake-prefix-path=$(brew --prefix googletest)")
          fi

          meson setup build \
            --buildtype=debugoptimized \
            -Dtests=true \
            -Dinstall=false \
            -Ddecoder=${{ matrix.decoder }} \
            -Dencoder=${{ matrix.encoder }} \
            "${extra_args[@]}"

      - name: Configure Meson on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          meson setup build --vsenv --buildtype=debugoptimized -Dtests=true -Dinstall=false -Ddecoder=${{ matrix.decoder }} -Dencoder=${{ matrix.encoder }}

      - name: Compile
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --print-errorlogs
